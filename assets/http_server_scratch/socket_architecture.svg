<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3776ab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4b8bbe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cExtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00599c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077be;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e44ad;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="hardwareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34495e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">
    Python Socket Architecture: From Code to Hardware
  </text>
  
  <!-- Python Application Layer -->
  <rect x="100" y="60" width="600" height="80" rx="10" fill="url(#pythonGrad)" stroke="#2c3e50" stroke-width="2"/>
  <text x="130" y="85" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">🐍 Python Application Layer</text>
  <text x="130" y="105" font-family="Arial, sans-serif" font-size="12" fill="white">import socket</text>
  <text x="130" y="120" font-family="Arial, sans-serif" font-size="12" fill="white">sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)</text>
  
  <!-- Arrow 1 -->
  <polygon points="390,150 410,150 400,170" fill="#7f8c8d"/>
  <text x="420" y="165" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Function Calls</text>
  
  <!-- Python C Extension -->
  <rect x="100" y="180" width="600" height="80" rx="10" fill="url(#cExtGrad)" stroke="#2c3e50" stroke-width="2"/>
  <text x="130" y="205" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">⚙️ Python Socket Module (C Extension)</text>
  <text x="130" y="225" font-family="Arial, sans-serif" font-size="12" fill="white">socketmodule.c - CPython's C implementation</text>
  <text x="130" y="240" font-family="Arial, sans-serif" font-size="12" fill="white">Bridge between Python and system calls</text>
  
  <!-- Arrow 2 -->
  <polygon points="390,270 410,270 400,290" fill="#7f8c8d"/>
  <text x="420" y="285" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Library Calls</text>
  
  <!-- C Socket Library -->
  <rect x="100" y="300" width="600" height="80" rx="10" fill="url(#socketGrad)" stroke="#2c3e50" stroke-width="2"/>
  <text x="130" y="325" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">📚 C Socket Library (socket.h)</text>
  <text x="130" y="345" font-family="Arial, sans-serif" font-size="12" fill="white">POSIX Socket API: socket(), bind(), listen(), accept()</text>
  <text x="130" y="360" font-family="Arial, sans-serif" font-size="12" fill="white">Standard interface across Unix systems</text>
  
  <!-- Arrow 3 -->
  <polygon points="390,390 410,390 400,410" fill="#7f8c8d"/>
  <text x="420" y="405" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">System Calls</text>
  
  <!-- Linux Kernel -->
  <rect x="100" y="420" width="600" height="80" rx="10" fill="url(#kernelGrad)" stroke="#2c3e50" stroke-width="2"/>
  <text x="130" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">🔧 Linux Kernel Space</text>
  <text x="130" y="465" font-family="Arial, sans-serif" font-size="12" fill="white">System calls: sys_socket(), sys_bind(), sys_listen()</text>
  <text x="130" y="480" font-family="Arial, sans-serif" font-size="12" fill="white">TCP/IP stack, network drivers, hardware abstraction</text>
  
  <!-- Arrow 4 -->
  <polygon points="390,510 410,510 400,530" fill="#7f8c8d"/>
  <text x="420" y="525" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Hardware I/O</text>
  
  <!-- Network Hardware -->
  <rect x="100" y="540" width="600" height="50" rx="10" fill="url(#hardwareGrad)" stroke="#2c3e50" stroke-width="2"/>
  <text x="130" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">🌐 Network Hardware (NIC, Ethernet, WiFi)</text>
  <text x="130" y="580" font-family="Arial, sans-serif" font-size="12" fill="white">Physical network transmission</text>
  
  <!-- Side annotations -->
  <rect x="20" y="200" width="70" height="30" rx="5" fill="#ecf0f1" stroke="#bdc3c7"/>
  <text x="55" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">User Space</text>
  
  <rect x="20" y="420" width="70" height="80" rx="5" fill="#ffebee" stroke="#ffcdd2"/>
  <text x="55" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c62828">Kernel</text>
  <text x="55" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c62828">Space</text>
  
  <!-- Dividing line -->
  <line x1="95" y1="415" x2="705" y2="415" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="710" y="420" font-family="Arial, sans-serif" font-size="11" fill="#e74c3c">Kernel Boundary</text>
</svg>